[project]
name = "ats-ai-service"
version = "0.1.0"
description = "AI Service cho AI-Powered Internal ATS: bóc tách CV, matching, LLM copilot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
# Dependencies nặng của pipeline AI — cài ở Phase 3:
#   pip install -e ".[ai]"
ai = [
  "pdfplumber>=0.11.0",
  "pdf2image>=1.17.0",
  "pytesseract>=0.3.13",
  "pillow>=11.0.0",
  "sentence-transformers>=3.3.0",
  "openai>=1.57.0",
  "httpx>=0.28.0",
]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
