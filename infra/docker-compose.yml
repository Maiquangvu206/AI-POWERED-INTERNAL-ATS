# =============================================================================
# Hạ tầng phát triển cho AI-Powered Internal ATS
#   docker compose -f infra/docker-compose.yml up -d
#
# Cổng trên máy host được chọn để KHÔNG đụng dịch vụ đang chạy sẵn:
#   5433 -> 5432  (máy dev đã có PostgreSQL local ở 5432)
#   6379 -> 6379  Redis
#   9000 -> 9000  MinIO S3 API
#   9001 -> 9001  MinIO Console
#   1025 -> 1025  SMTP (Mailpit)
#   8025 -> 8025  Web UI đọc mail
# =============================================================================

name: ats

services:
  postgres:
    image: postgres:16-alpine
    container_name: ats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_local_password
      POSTGRES_DB: ats
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ats -d ats']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ats-net

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    restart: unless-stopped
    # noeviction: KHÔNG được evict key của BullMQ, nếu không job sẽ biến mất
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ats-net

  # RustFS — S3-compatible, thay MinIO (MinIO đã ngừng publish image từ 2025)
  # Console: http://localhost:9001  ·  S3 API: http://localhost:9000
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ats-rustfs
    restart: unless-stopped
    command:
      ['server', '/data', '--address', ':9000', '--console-enable', '--console-address', ':9001']
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    networks:
      - ats-net

  # Tạo bucket private ngay sau khi RustFS lên (chạy 1 lần rồi thoát)
  storage-init:
    image: amazon/aws-cli:latest
    container_name: ats-storage-init
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          echo "⏳ chờ RustFS..."; sleep 2;
        done
        aws --endpoint-url http://rustfs:9000 s3 mb s3://cv-files 2>/dev/null || true
        echo "✅ bucket cv-files đã sẵn sàng (private, path-style)"
    networks:
      - ats-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: ats-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - ats-net

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  rustfs-logs:

networks:
  ats-net:
    driver: bridge
